<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <g id="background">
    <rect x="52" y="390" width="43" height="0.25" fill="#ebebeb"/>
    <rect x="405" y="398" width="45" height="0.25" fill="#ebebeb"/>
    <rect y="382" width="500" height="0.25" fill="#ebebeb"/>
    <ellipse cx="250" cy="412" rx="180" ry="11" fill="#f5f5f5"/>
  </g>
  
  <g id="briefcase">
    <!-- Main briefcase body -->
    <rect x="120" y="200" width="260" height="160" rx="15" fill="#407BFF"/>
    <rect x="120" y="200" width="260" height="160" rx="15" fill="#fff" opacity="0.1"/>
    
    <!-- Briefcase top section -->
    <rect x="120" y="200" width="260" height="50" rx="15" fill="#407BFF"/>
    <rect x="120" y="235" width="260" height="15" fill="#407BFF"/>
    
    <!-- Handle -->
    <path d="M200 200 L200 170 Q200 155 215 155 L285 155 Q300 155 300 170 L300 200" fill="none" stroke="#407BFF" stroke-width="12" stroke-linecap="round"/>
    <path d="M200 200 L200 175 Q200 165 210 165 L290 165 Q300 165 300 175 L300 200" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Briefcase clasp/lock -->
    <rect x="230" y="270" width="40" height="30" rx="5" fill="#fff" opacity="0.9"/>
    <circle cx="250" cy="285" r="6" fill="#407BFF"/>
    
    <!-- Decorative lines -->
    <line x1="120" y1="250" x2="380" y2="250" stroke="#fff" stroke-width="2" opacity="0.2"/>
    
    <!-- Side details -->
    <rect x="130" y="265" width="60" height="8" rx="4" fill="#fff" opacity="0.2"/>
    <rect x="130" y="280" width="40" height="8" rx="4" fill="#fff" opacity="0.2"/>
    <rect x="310" y="265" width="60" height="8" rx="4" fill="#fff" opacity="0.2"/>
    <rect x="330" y="280" width="40" height="8" rx="4" fill="#fff" opacity="0.2"/>
  </g>
  
  <g id="chart-overlay">
    <!-- Bar chart rising -->
    <rect x="145" y="320" width="20" height="30" fill="#fff" opacity="0.3"/>
    <rect x="175" y="305" width="20" height="45" fill="#fff" opacity="0.3"/>
    <rect x="205" y="290" width="20" height="60" fill="#fff" opacity="0.3"/>
    
    <!-- Trend arrow -->
    <path d="M310 340 L340 310 L360 320 L390 280" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <polygon points="390,270 400,285 385,290" fill="#fff" opacity="0.4"/>
  </g>
  
  <g id="floating-elements">
    <!-- Coin 1 -->
    <ellipse cx="90" cy="180" rx="30" ry="30" fill="#FFC727"/>
    <ellipse cx="90" cy="175" rx="30" ry="30" fill="#FFD94D"/>
    <text x="90" y="185" text-anchor="middle" fill="#B8860B" font-size="24" font-weight="bold">$</text>
    
    <!-- Coin 2 -->
    <ellipse cx="420" cy="150" rx="25" ry="25" fill="#FFC727"/>
    <ellipse cx="420" cy="146" rx="25" ry="25" fill="#FFD94D"/>
    <text x="420" y="155" text-anchor="middle" fill="#B8860B" font-size="20" font-weight="bold">$</text>
    
    <!-- Document -->
    <rect x="400" y="250" width="60" height="80" rx="5" fill="#f5f5f5"/>
    <rect x="400" y="250" width="60" height="20" rx="5" fill="#407BFF" opacity="0.8"/>
    <rect x="410" y="280" width="40" height="4" rx="2" fill="#e0e0e0"/>
    <rect x="410" y="290" width="35" height="4" rx="2" fill="#e0e0e0"/>
    <rect x="410" y="300" width="40" height="4" rx="2" fill="#e0e0e0"/>
    <rect x="410" y="310" width="25" height="4" rx="2" fill="#e0e0e0"/>
    
    <!-- Graph icon -->
    <rect x="50" y="280" width="50" height="50" rx="8" fill="#fff"/>
    <rect x="50" y="280" width="50" height="50" rx="8" fill="#407BFF" opacity="0.1"/>
    <polyline points="60,320 70,305 80,312 95,295" fill="none" stroke="#407BFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="95" cy="295" r="4" fill="#FFC727"/>
  </g>
  
  <g id="shadow">
    <ellipse cx="250" cy="380" rx="120" ry="15" fill="#407BFF" opacity="0.1"/>
  </g>
</svg>
