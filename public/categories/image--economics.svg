<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <g id="background">
    <rect x="52" y="390" width="43" height="0.25" fill="#ebebeb"/>
    <rect x="405" y="398" width="45" height="0.25" fill="#ebebeb"/>
    <rect y="382" width="500" height="0.25" fill="#ebebeb"/>
    <ellipse cx="250" cy="412" rx="180" ry="11" fill="#f5f5f5"/>
  </g>
  
  <g id="main-chart">
    <!-- Chart background -->
    <rect x="100" y="140" width="300" height="220" rx="15" fill="#fff"/>
    <rect x="100" y="140" width="300" height="220" rx="15" fill="#407BFF" opacity="0.05"/>
    
    <!-- Chart grid lines -->
    <line x1="130" y1="180" x2="370" y2="180" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="130" y1="220" x2="370" y2="220" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="130" y1="260" x2="370" y2="260" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="130" y1="300" x2="370" y2="300" stroke="#e0e0e0" stroke-width="1"/>
    
    <!-- Y-axis -->
    <line x1="130" y1="160" x2="130" y2="330" stroke="#263238" stroke-width="2"/>
    <!-- X-axis -->
    <line x1="130" y1="330" x2="380" y2="330" stroke="#263238" stroke-width="2"/>
    
    <!-- Supply curve (blue) -->
    <path d="M140 320 Q200 280 250 240 Q300 200 360 170" fill="none" stroke="#407BFF" stroke-width="4" stroke-linecap="round"/>
    <text x="365" y="165" fill="#407BFF" font-size="14" font-weight="bold">S</text>
    
    <!-- Demand curve (orange/gold) -->
    <path d="M140 170 Q200 200 250 240 Q300 280 360 320" fill="none" stroke="#FFC727" stroke-width="4" stroke-linecap="round"/>
    <text x="365" y="325" fill="#FFC727" font-size="14" font-weight="bold">D</text>
    
    <!-- Equilibrium point -->
    <circle cx="250" cy="240" r="10" fill="#407BFF"/>
    <circle cx="250" cy="240" r="6" fill="#fff"/>
    
    <!-- Equilibrium lines (dashed) -->
    <line x1="250" y1="240" x2="250" y2="330" stroke="#407BFF" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
    <line x1="130" y1="240" x2="250" y2="240" stroke="#407BFF" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
    
    <!-- Labels -->
    <text x="115" y="245" fill="#263238" font-size="12">P*</text>
    <text x="245" y="345" fill="#263238" font-size="12">Q*</text>
  </g>
  
  <g id="floating-elements">
    <!-- Coin stack left -->
    <ellipse cx="70" cy="200" rx="35" ry="10" fill="#B8860B"/>
    <ellipse cx="70" cy="195" rx="35" ry="10" fill="#FFC727"/>
    <ellipse cx="70" cy="185" rx="35" ry="10" fill="#B8860B"/>
    <ellipse cx="70" cy="180" rx="35" ry="10" fill="#FFC727"/>
    <ellipse cx="70" cy="170" rx="35" ry="10" fill="#B8860B"/>
    <ellipse cx="70" cy="165" rx="35" ry="10" fill="#FFD94D"/>
    
    <!-- Coin stack right -->
    <ellipse cx="430" cy="280" rx="30" ry="8" fill="#B8860B"/>
    <ellipse cx="430" cy="276" rx="30" ry="8" fill="#FFC727"/>
    <ellipse cx="430" cy="268" rx="30" ry="8" fill="#B8860B"/>
    <ellipse cx="430" cy="264" rx="30" ry="8" fill="#FFD94D"/>
    
    <!-- Arrow indicators -->
    <g transform="translate(420, 180)">
      <polygon points="0,30 15,0 30,30" fill="#4CAF50" opacity="0.8"/>
      <rect x="10" y="30" width="10" height="20" fill="#4CAF50" opacity="0.8"/>
    </g>
    
    <g transform="translate(60, 280)">
      <rect x="10" y="0" width="10" height="20" fill="#f44336" opacity="0.8"/>
      <polygon points="0,20 15,50 30,20" fill="#f44336" opacity="0.8"/>
    </g>
    
    <!-- Percentage badge -->
    <circle cx="420" cy="130" r="25" fill="#407BFF"/>
    <text x="420" y="136" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">%</text>
    
    <!-- Dollar signs -->
    <text x="80" y="310" fill="#407BFF" font-size="30" font-weight="bold" opacity="0.3">$</text>
    <text x="400" y="350" fill="#FFC727" font-size="25" font-weight="bold" opacity="0.5">$</text>
  </g>
  
  <g id="bar-chart-mini">
    <!-- Mini bar chart -->
    <rect x="320" y="70" width="80" height="60" rx="8" fill="#fff"/>
    <rect x="320" y="70" width="80" height="60" rx="8" stroke="#407BFF" stroke-width="2" fill="none" opacity="0.3"/>
    <rect x="332" y="105" width="12" height="20" fill="#407BFF" opacity="0.6"/>
    <rect x="350" y="95" width="12" height="30" fill="#407BFF" opacity="0.8"/>
    <rect x="368" y="85" width="12" height="40" fill="#407BFF"/>
    <rect x="386" y="90" width="12" height="35" fill="#FFC727"/>
  </g>
  
  <g id="pie-chart-mini">
    <!-- Mini pie chart -->
    <circle cx="130" cy="100" r="35" fill="#fff"/>
    <circle cx="130" cy="100" r="35" stroke="#e0e0e0" stroke-width="1" fill="none"/>
    <path d="M130 100 L130 65 A35 35 0 0 1 161 115 Z" fill="#407BFF"/>
    <path d="M130 100 L161 115 A35 35 0 0 1 105 125 Z" fill="#FFC727"/>
    <path d="M130 100 L105 125 A35 35 0 0 1 130 65 Z" fill="#407BFF" opacity="0.4"/>
  </g>
  
  <g id="shadow">
    <ellipse cx="250" cy="380" rx="140" ry="18" fill="#407BFF" opacity="0.1"/>
  </g>
</svg>
